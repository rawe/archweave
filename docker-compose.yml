# Copy this file next to the code you want to model and run `docker compose up -d`.
# Then open http://localhost:4317 and connect your coding agent to http://localhost:4317/mcp.
services:
  archweave:
    image: ${ARCHWEAVE_IMAGE:-ghcr.io/rawe/archweave:latest}
    # Files in .archweave/ are written as this user; match your own (`id -u`, `id -g`).
    user: "${ARCHWEAVE_UID:-1000}:${ARCHWEAVE_GID:-1000}"
    ports:
      - "127.0.0.1:4317:4317"
    volumes:
      - ./:/repo
    environment:
      ARCHWEAVE_DATA_DIR: /repo/.archweave
      # Lets the UI build "open in editor" links to files on your machine.
      ARCHWEAVE_HOST_REPO_PATH: ${PWD}
    restart: unless-stopped
