# ArchWeave: put this file in the root of the repository you want to model,
# run `docker compose up -d` there and open http://localhost:4317.
services:
  archweave:
    # To pin a release, replace "latest" with a version from
    # https://github.com/rawe/archweave/pkgs/container/archweave (e.g. 0.1.0).
    image: ghcr.io/rawe/archweave:latest
    # Linux only: uncomment and use your own ids (`id -u`, `id -g`) if they are not 1000.
    # user: "1000:1000"
    ports:
      - "127.0.0.1:4317:4317"
    volumes:
      - ./:/repo
    environment:
      ARCHWEAVE_DATA_DIR: /repo/.archweave
      ARCHWEAVE_HOST_REPO_PATH: ${PWD}  # enables "open in editor" links
    restart: unless-stopped
