# Release the container image to GitHub Container Registry
#
# Triggered by pushing a semantic version tag, e.g. v0.1.0 or v0.2.0-beta.1.
# Builds linux/amd64 + linux/arm64 and pushes ghcr.io/{owner}/archweave:{version}
# (plus :latest for final versions) through `make release`.

name: Release Image

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

env:
  REGISTRY: ghcr.io

jobs:
  release:
    name: Build and Push Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        run: |
          make release \
            VERSION=${{ env.VERSION }} \
            REGISTRY=${{ env.REGISTRY }}/${{ github.repository_owner }} \
            PUSH=true

      - name: Release summary
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/archweave"
          {
            echo "## Release ${{ env.VERSION }}"
            echo ""
            echo "Platforms: linux/amd64, linux/arm64"
            echo ""
            echo '```bash'
            echo "docker pull $IMAGE:${{ env.VERSION }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
